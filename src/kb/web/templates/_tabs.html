{# 竖排页签。`tabs` 是 [(面板 id, 名字)]，空列表就不渲染。

   点击靠 base.html 底部那几行脚本切换面板——不引入框架，
   和侧栏折叠用的是同一招（`onclick`）。 #}
{% if tabs %}
<div class="tabs">
  {% for panel, name in tabs %}
    <button type="button" class="tab {{ 'active' if loop.first }}"
            data-panel="{{ panel }}">{{ name }}</button>
  {% endfor %}
</div>
{% endif %}
