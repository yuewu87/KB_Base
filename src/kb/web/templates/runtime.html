{% extends "base.html" %}
{% block content %}
<h1>运行日志</h1>
<p class="muted mono">{{ log_path }}（末尾 {{ log_text.splitlines() | length }} 行）</p>

{% if domains %}
  <p class="muted">领域：{% for d in domains %}<span class="tag">{{ d }}</span>{% endfor %}</p>
{% endif %}

{% if log_text %}
  <pre class="term">{{ log_text }}</pre>
{% else %}
  <p class="muted">
    日志还是空的。做一次整理（<code>kb organize</code>）就会写进来。
  </p>
{% endif %}
{% endblock %}
