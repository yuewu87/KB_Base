<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}KN_Base{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="shell">

    <nav class="sidebar" aria-label="主导航">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">KB</span>
        <span class="brand-name">KN_Base</span>
      </div>

      <button class="toggle" type="button"
              onclick="document.body.classList.toggle('collapsed')"
              aria-label="折叠/展开侧栏">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
        <span class="side-label">收起</span>
      </button>

      <a href="/new" class="side-action {{ 'active' if active == 'new' }}">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        <span class="side-label">记一条</span>
      </a>

      <a href="/" class="side-btn {{ 'active' if active == 'chat' }}">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a8 8 0 0 1-8 8H7l-4 3V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/>
        </svg>
        <span class="side-label">ai对话</span>
      </a>

      <a href="/journal" class="side-btn {{ 'active' if active == 'journal' }}">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 5h16M4 10h16M4 15h10M4 20h7"/>
        </svg>
        <span class="side-label">整理日志</span>
      </a>

      <a href="/flow" class="side-btn {{ 'active' if active == 'flow' }}">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 7h6l2 3h10M3 17h6l2-3h10"/>
        </svg>
        <span class="side-label">工作日志</span>
      </a>

      <a href="/runtime" class="side-btn {{ 'active' if active == 'runtime' }}">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 7l5 5-5 5M13 17h6"/>
        </svg>
        <span class="side-label">运行日志</span>
      </a>

      <a href="/sweep" class="side-btn {{ 'active' if active == 'sweep' }}">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 11a8 8 0 1 0-2.3 5.7"/>
          <path d="M20 5v6h-6"/>
        </svg>
        <span class="side-label">巡检</span>
      </a>

      <div class="side-sep"></div>

      <button type="button" class="side-btn" onclick="openSettings()">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
        </svg>
        <span class="side-label">设置</span>
      </button>

      <div class="side-sep"></div>

      <button type="button" class="side-btn quit" onclick="quitService()">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <path d="M16 17l5-5-5-5M21 12H9"/>
        </svg>
        <span class="side-label">退出</span>
      </button>

      <div class="side-foot">
        vault<br>{{ vault }}
      </div>
    </nav>

    <main class="main">
      {% block content %}{% endblock %}
    </main>

  </div>

  <script>
    // 竖排页签：点哪个，就只显示它对应的面板。
    // 只有几行——为这个拖一个框架进来不划算（和侧栏折叠同一个路子）。
    document.querySelectorAll('.tab').forEach(function (tab) {
      tab.addEventListener('click', function () {
        const aside = tab.closest('.tabbed');
        aside.querySelectorAll('.tab').forEach(function (t) {
          t.classList.toggle('active', t === tab);
        });
        aside.querySelectorAll('.pane').forEach(function (p) {
          p.hidden = p.dataset.pane !== tab.dataset.panel;
        });
      });
    });
  </script>

  <div class="overlay" id="settings-overlay" hidden>
    <div class="modal" id="settings-modal"></div>
  </div>

  <div class="overlay" id="quit-notice" hidden>
    <div class="modal notice">
      <h2>服务已停</h2>
      <p>知识库服务已经关掉了。可以关掉这个标签页了。</p>
      <p class="hint">下次用的时候双击 <code>web.bat</code>，或随便跑一条 <code>kb</code> 命令，它会自己起来。</p>
      <button type="button" onclick="document.getElementById('quit-notice').hidden = true">知道了</button>
    </div>
  </div>

  <script>
    // 设置窗：fetch 片段塞进遮罩层。不从每个页面各背一份隐藏的窗口标记——
    // 那会让每页都拖着一坨用不到的 HTML。
    async function openSettings() {
      const box = document.getElementById('settings-modal');
      box.innerHTML = '<p class="muted" style="padding:20px">载入中…</p>';
      document.getElementById('settings-overlay').hidden = false;
      const r = await fetch('/settings');
      box.innerHTML = await r.text();
    }

    function closeSettings() {
      document.getElementById('settings-overlay').hidden = true;
    }

    function showGroup(btn) {
      const modal = btn.closest('.modal');
      modal.querySelectorAll('.nav-item').forEach(function (b) {
        b.classList.toggle('active', b === btn);
      });
      modal.querySelectorAll('.pane').forEach(function (p) {
        p.hidden = p.dataset.group !== btn.dataset.group;
      });
    }

    function _msg(text, ok) {
      const el = document.getElementById('settings-msg');
      el.textContent = text;
      el.classList.toggle('bad', !ok);
      el.hidden = false;
    }

    async function saveSettings(form) {
      const values = Object.fromEntries(new FormData(form));
      const r = await fetch('/settings', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({values: values}),
      });
      const data = await r.json().catch(function () { return {}; });
      if (r.ok) {
        const n = Object.keys(data.saved || {}).length;
        _msg(n ? '已保存 ' + n + ' 项，立刻生效' : '没有要改的', true);
      } else {
        _msg((data.detail || '保存失败') + '（HTTP ' + r.status + '）', false);
      }
      return false;          // 别让表单自己提交、把页面刷掉
    }

    async function testConnection(btn) {
      const form = document.getElementById('settings-form');
      btn.disabled = true;
      _msg('测试中…', true);

      // **body 必传**：端点要的是「表单里当前填的值」，不带 body 会 422
      // （那只能测已保存的配置，而用户刚改的正是表单里的值）。
      const values = Object.fromEntries(new FormData(form));
      const r = await fetch('/settings/test', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({values: values}),
      });
      const data = await r.json().catch(function () { return {}; });

      btn.disabled = false;
      if (r.ok && data.ok) {
        _msg('通了 · ' + data.seconds + ' 秒', true);
      } else {
        // **带上状态码**：不带的话 422 会显示成「未知原因」，排查时找不到北
        _msg('不通：' + (data.detail || data.msg || '未知原因') + '（HTTP ' + r.status + '）', false);
      }
    }

    async function quitService() {
      if (!confirm('停掉知识库服务？')) return;
      try { await fetch('/quit', {method: 'POST'}); } catch (e) { /* 服务可能已经没了 */ }
      closeSettings();
      document.getElementById('quit-notice').hidden = false;
    }
  </script>
</body>
</html>
