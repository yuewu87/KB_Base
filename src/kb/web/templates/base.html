<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}KN_Base{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="shell">

    <nav class="sidebar" aria-label="主导航">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">KB</span>
        <span class="brand-name">KN_Base</span>
      </div>

      <button class="toggle" type="button"
              onclick="document.body.classList.toggle('collapsed')"
              aria-label="折叠/展开侧栏">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
        <span class="side-label">收起</span>
      </button>

      <a href="/new" class="side-action {{ 'active' if active == 'new' }}">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        <span class="side-label">记一条</span>
      </a>

      <form method="post" action="/sweep/run">
        <button class="side-action" type="submit">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 11a8 8 0 1 0-2.3 5.7"/>
            <path d="M20 5v6h-6"/>
          </svg>
          <span class="side-label">巡检一次</span>
        </button>
      </form>

      <a href="/" class="side-btn {{ 'active' if active == 'chat' }}">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a8 8 0 0 1-8 8H7l-4 3V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/>
        </svg>
        <span class="side-label">ai对话</span>
      </a>

      <a href="/journal" class="side-btn {{ 'active' if active == 'journal' }}">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 5h16M4 10h16M4 15h10M4 20h7"/>
        </svg>
        <span class="side-label">整理日志</span>
      </a>

      <a href="/flow" class="side-btn {{ 'active' if active == 'flow' }}">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 7h6l2 3h10M3 17h6l2-3h10"/>
        </svg>
        <span class="side-label">工作日志</span>
      </a>

      <a href="/runtime" class="side-btn {{ 'active' if active == 'runtime' }}">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 7l5 5-5 5M13 17h6"/>
        </svg>
        <span class="side-label">运行日志</span>
      </a>

      <div class="side-foot">
        vault<br>{{ vault }}
      </div>
    </nav>

    <main class="main">
      {% block content %}{% endblock %}
    </main>

  </div>

  <script>
    // 竖排页签：点哪个，就只显示它对应的面板。
    // 只有几行——为这个拖一个框架进来不划算（和侧栏折叠同一个路子）。
    document.querySelectorAll('.tab').forEach(function (tab) {
      tab.addEventListener('click', function () {
        const aside = tab.closest('.tabbed');
        aside.querySelectorAll('.tab').forEach(function (t) {
          t.classList.toggle('active', t === tab);
        });
        aside.querySelectorAll('.pane').forEach(function (p) {
          p.hidden = p.dataset.pane !== tab.dataset.panel;
        });
      });
    });
  </script>
</body>
</html>
