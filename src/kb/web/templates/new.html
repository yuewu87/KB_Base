{% extends "base.html" %}
{% block title %}记一条 · KN_Base{% endblock %}
{% block content %}
<div class="page-head">
  <h1>记一条</h1>
  <p>选个脚手架帮自己把话说清。放哪、叫什么、算什么类型——整理的时候再定。</p>
</div>

<div class="chips">
  {% for name in templates %}
    <a class="chip {{ 'active' if name == chosen }}" href="/new?t={{ name }}">{{ name }}</a>
  {% endfor %}
  <a class="chip {{ 'active' if not chosen }}" href="/new">空白</a>
</div>

<form class="compose" method="post" action="/new">
  <label for="content" class="sr-only">正文</label>
  <textarea id="content" name="content" rows="12"
            placeholder="想到什么写什么……">{{ body }}</textarea>
  <div class="compose-foot">
    <span class="muted">只填正文就行，不用先想放在哪。</span>
    <button type="submit">投递</button>
  </div>
</form>

<script>
  // 投递是**同步**的：服务要调模型判断放哪、写文件、还要打个 git commit。
  // 这一整段页面都不动，点完像是没反应——人就会再点一次，投出两条草稿。
  //
  // 所以点下去先把话说清楚：正在整理，不是卡住了。
  document.querySelector('.compose').addEventListener('submit', function (e) {
    const form = e.currentTarget;
    if (!form.querySelector('textarea[name="content"]').value.trim()) return;

    const hint = form.querySelector('.muted');
    hint.textContent = '整理中…正在判断放哪、写进库。';

    const btn = form.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.textContent = '整理中…';
  });
</script>
{% endblock %}
